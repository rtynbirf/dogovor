name: dogovor-guard
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ДОГОВОР-ФСМ · самотест + карточки
        run: |
          python3 dogovor_fsm.py --selftest
          python3 dogovor_fsm.py --check kartochki
          echo "ДОГОВОР ЦЕЛ: самотест зелёный, карточки ЧИТАЕМО"
